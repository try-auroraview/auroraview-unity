name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: loonghao/vx@6948178844826716e636b474ab322dd8dc115578
        with:
          version: '0.9.35'
          tools: 'just node@22 cmake@3.31'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx just test
      - run: vx just package
      - uses: actions/upload-artifact@v7
        with:
          name: auroraview-unity-windows-x64
          path: build/package/*.zip
          if-no-files-found: error
